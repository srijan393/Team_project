<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Monitoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            color: #495057;
        }
        .container {
            max-width: 1000px;
            margin-top: 30px;
        }
        h1, h3 {
            color: #343a40;
        }
        .card {
            border: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        .btn {
            font-weight: bold;
        }
        .form-control {
            border-radius: 25px;
            padding: 10px 15px;
            font-size: 1.1rem;
        }
        .chart-container {
            margin-top: 40px;
        }
        .chart-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        .form-group label {
            font-weight: bold;
        }
        .navigation-btns {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Page Title -->
        <h1 class="text-center mt-5 mb-4">Air Quality Monitoring</h1>

        <!-- Navigation Buttons -->
        <div class="navigation-btns">
            <a href="{% url 'view_data' %}" class="btn btn-secondary"><i class="fas fa-table"></i> View All Data</a>
            <a href="{% url 'air_quality_list' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Add New Data</a>
        </div>

        <!-- Temperature Chart -->
        <div class="card chart-container">
            <h3 class="text-center chart-title">Temperature vs Time</h3>
            <canvas id="temperatureChart"></canvas>
        </div>

        <!-- Humidity Chart -->
        <div class="card chart-container">
            <h3 class="text-center chart-title">Humidity vs Time</h3>
            <canvas id="humidityChart"></canvas>
        </div>

        <!-- Air Quality Chart -->
        <div class="card chart-container">
            <h3 class="text-center chart-title">Air Quality vs Time</h3>
            <canvas id="airQualityChart"></canvas>
        </div>

        <!-- Add New Data Form -->
        <div class="card">
            <div class="card-body">
                <h3 class="text-center mb-4">Add New Data</h3>
                <form method="POST">
                    {% csrf_token %}
                    <div class="form-row">
                        <div class="col-md-4 mb-3">
                            <label for="temperature">Temperature (°C)</label>
                            {{ form.temperature }}
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="humidity">Humidity (%)</label>
                            {{ form.humidity }}
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="air_quality">Air Quality</label>
                            {{ form.air_quality }}
                        </div>

                    </div>
                    <button type="submit" class="btn btn-success btn-block">Submit</button>
                </form>
            </div>
        </div>

    </div>

    <script>
        // Temperature Chart
        var ctx1 = document.getElementById('temperatureChart').getContext('2d');
        var temperatureChart = new Chart(ctx1, {
            type: 'line',
            data: {
                labels: {{ data_timestamps|safe }},
                datasets: [{
                    label: 'Temperature (°C)',
                    data: {{ data_temperature|safe }},
                    borderColor: 'rgb(75, 192, 192)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    fill: false,
                    pointBackgroundColor: 'rgb(75, 192, 192)'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        ticks: {
                            autoSkip: true,
                            maxTicksLimit: 10
                        }
                    },
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Humidity Chart
        var ctx2 = document.getElementById('humidityChart').getContext('2d');
        var humidityChart = new Chart(ctx2, {
            type: 'line',
            data: {
                labels: {{ data_timestamps|safe }},
                datasets: [{
                    label: 'Humidity (%)',
                    data: {{ data_humidity|safe }},
                    borderColor: 'rgb(153, 102, 255)',
                    backgroundColor: 'rgba(153, 102, 255, 0.2)',
                    fill: false,
                    pointBackgroundColor: 'rgb(153, 102, 255)'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        ticks: {
                            autoSkip: true,
                            maxTicksLimit: 10
                        }
                    },
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Air Quality Chart
        var ctx3 = document.getElementById('airQualityChart').getContext('2d');
        var airQualityChart = new Chart(ctx3, {
            type: 'line',
            data: {
                labels: {{ data_timestamps|safe }},
                datasets: [{
                    label: 'Air Quality',
                    data: {{ data_air_quality|safe }},
                    borderColor: 'rgb(255, 159, 64)',
                    backgroundColor: 'rgba(255, 159, 64, 0.2)',
                    fill: false,
                    pointBackgroundColor: 'rgb(255, 159, 64)'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        ticks: {
                            autoSkip: true,
                            maxTicksLimit: 10
                        }
                    },
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>

    <!-- Bootstrap & JS Libraries -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.0.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
