<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Air Quality Data</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            color: #495057;
        }
        .container {
            max-width: 1200px;
            margin-top: 50px;
        }
        h1 {
            color: #343a40;
            font-size: 2rem;
            font-weight: bold;
        }
        .btn-secondary {
            font-weight: bold;
        }
        .table {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .table th {
            background-color: #343a40;
            color: white;
        }
        .table td {
            text-align: center;
            font-size: 1rem;
        }
        .table tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .table tbody tr:hover {
            background-color: #e9ecef;
        }
        .table-container {
            margin-top: 30px;
        }
        .back-btn {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Page Title -->
        <h1 class="text-center">All Air Quality Data</h1>

        <!-- Back Button -->
        <div class="back-btn text-center">
            <a href="{% url 'air_quality_list' %}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Add Data
            </a>
        </div>

        <div class="table-container">
            <!-- Data Table -->
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th scope="col">Timestamp</th>
                        <th scope="col">Temperature (°C)</th>
                        <th scope="col">Humidity (%)</th>
                        <th scope="col">Air Quality</th>
                    </tr>
                </thead>
                <tbody>
                    {% for entry in data %}
                        <tr>
                            <td>{{ entry.timestamp }}</td>
                            <td>{{ entry.temperature }}</td>
                            <td>{{ entry.humidity }}</td>
                            <td>{{ entry.air_quality }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.0.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
